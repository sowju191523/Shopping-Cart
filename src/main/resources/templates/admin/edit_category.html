<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<section>
	 <div class="container-fluid p-5 mt-5">
            <div class="row">

                <!-- Left Side: Form -->
                <div class="col-md-3 offset-md-5">
                    <div class="card card-sh">
                        <div class="card-header text-center">
                            <p class="fs-4">Edit Category</p>

                            <th:block th:if="${session.succMsg}">
                                <p class="text-success fw-bold">[[${session.succMsg}]]</p>
                                <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                            </th:block>

                            <th:block th:if="${session.errorMsg}">
                                <p class="text-danger fw-bold">[[${session.errorMsg}]]</p>
                               <th:block th:text="${@commonServiceImpl.removeSessionMessage()}"></th:block>
                            </th:block>
                        </div>

                        <div class="card-body">
                            <form action="/admin/updateCategory" method="post" enctype="multipart/form-data">
                                <div class="mb-3">
                                <input type="hidden" name="id"  th:value="${category.id}">
                                    <label>Enter Category</label>
                                    <input type="text" name="name" class="form-control" th:value="${category.name}">
                                </div>

                                <div class="mb-3">
                                    <label>Status</label>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="isActive" th:checked="${category.isActive==true}"
                                               id="radioDefault1"  value="true">
                                        <label class="form-check-label" for="radioDefault1">Active</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="isActive"th:checked="${category.isActive==false}"
                                               id="radioDefault2" value="false">
                                        <label class="form-check-label" for="radioDefault2">InActive</label>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label>Upload File</label>
                                    <input type="file" name="file" class="form-control">
                                </div>
                                <img th:src="@{'/img/category_img/'+${category.imageName}}" width="100px" height="100px"> 
                                <button class="btn btn-primary col-md-12 mt-2">Update</button>
                            </form>
                        </div>
                    </div>
                </div>

            

            </div> <!-- end of row -->
        </div> <!-- end of container -->

		
	</section>
</body>
</html>
